[project]
name = "cv-lab3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "accelerate>=1.2,<2; sys_platform == 'win32'",
    "diffusers==0.35.2; sys_platform == 'win32'",
    "lpips==0.1.4; sys_platform == 'win32'",
    "piq==0.8.0; sys_platform == 'win32'",
    "torch==2.8.0; sys_platform == 'win32'",
    "torchmetrics>=1.8,<2; sys_platform == 'win32'",
    "torchvision==0.23.0; sys_platform == 'win32'",
    "transformers>=4.48,<5; sys_platform == 'win32'",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin'",
]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
